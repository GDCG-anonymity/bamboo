<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>어둠탐사기록에서 전해드립니다</title>
  <meta name="description" content="익명으로 전하는 이야기">
  <meta property="og:title" content="어둠탐사기록에서 전해드립니다">
  <meta property="og:description" content="익명으로 전하는 이야기">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" id="favicon" type="image/png" href="logos/dark-icon.png">
  <link rel="stylesheet" href="style.css">
  <script>
    // 첫 화면 깜빡임 방지: 저장된 테마를 먼저 적용
    try { var t = localStorage.getItem('jd-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="site-head">
    <div class="wrap">
      <div class="brand">
        <img class="brand-logo" id="brandLogo" src="logos/dark-invert.png" alt="" width="44" height="44">
        <span class="brand-org" id="brandOrg"></span>
      </div>
      <h1 class="site-title"><a href="#/" id="siteTitle"></a></h1>
      <p class="tagline" id="tagline"></p>
      <nav class="theme-switch" id="themeSwitch" aria-label="테마 선택"></nav>
    </div>
  </header>

  <main class="wrap" id="view" aria-live="polite"></main>

  <footer class="site-foot wrap">
    <p id="footNote"></p>
    <p class="admin-row"><button type="button" class="link-btn" id="adminBtn">관리자</button></p>
  </footer>

  <button type="button" class="fab" id="writeBtn"></button>

  <div class="overlay" id="overlay" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
